allowBuilds:
  "@ast-grep/cli": true
  sharp: false
  unrs-resolver: false
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  msw: false
overrides:
  "@modelcontextprotocol/sdk": ">=1.31.0"
  linkify-it: ">=5.0.2"
  qs: ">=6.16.0"
  smol-toml: ">=1.9.0"
  katex: ">=0.18.2"
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (stack exhaustion DoS on deeply nested patterns) has no
    # patched release. It is reached only through developer tools (shadcn CLI,
    # Ladle, markdownlint) that expand fixed, trusted glob patterns.
    # Upstream tracking: https://github.com/micromatch/braces/issues/84
    # Reassess when a fixed braces version exists.
    - GHSA-vfj7-8cjw-p6xm

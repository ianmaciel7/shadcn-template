  - 'type CardProps = ComponentProps<"div"> & { title: string };'
  - 'type ContainerProps = HTMLAttributes<HTMLDivElement>;'
  - 'interface ProviderProps extends PropsWithChildren { value: string; }'
  - 'type ThemeContextProps = { theme: string };'
  - 'type PageProps = { params: Promise<{ slug: string }> };'
  - 'type LayoutProps = { children: ReactNode };'
invalid:

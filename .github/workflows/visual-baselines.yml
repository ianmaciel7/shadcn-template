name: Update visual baselines

# Run manually after a reviewed, intentional UI change. It regenerates the
# screenshots in the same container the CI compares them in and publishes them
# as an artifact; download them with `gh run download` and commit them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-baselines
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  update:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/visual.spec.ts-snapshots/*.png
          if-no-files-found: error

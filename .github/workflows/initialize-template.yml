name: Initialize Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-repository:
    # Only run in derived repositories, not the root template
    if: github.repository != 'ianmaciel7/shadcn-template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Configure GitHub Branch Protection & Settings
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/setup-github.mjs

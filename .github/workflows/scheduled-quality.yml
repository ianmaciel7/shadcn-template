name: Scheduled quality

# Slow checks that are too expensive for every push: weekly Lighthouse and
# manual-only mutation testing until its hosted-run behavior is verified.
# Fallow and React Doctor already run in ci.yml (pnpm verify:static).
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  mutation:
    name: Mutation testing (Stryker)
    # Do not schedule unverified mutation jobs for every derived repository.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails when the mutation score drops below the "break" threshold in
      # stryker.config.json. The HTML report is added to the console one.
      - run: pnpm test:mutation --reporters clear-text,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Lighthouse only reports scores; it has no pass/fail threshold, so this
      # job fails only when the audit itself cannot run.
      - name: Start the server and run Lighthouse
        run: |
          set -euo pipefail
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROME_PATH
          pnpm start > "$RUNNER_TEMP/next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000 && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:3000
          pnpm analyze:lighthouse:ci
      - name: Server log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/next.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          retention-days: 7
          if-no-files-found: ignore
